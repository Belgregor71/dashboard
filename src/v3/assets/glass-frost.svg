<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<!-- v3ColdGlass frost, from the still approved 2026-11-14. Radii are 72%x78% (veil) and 70%x76% (mask) of the wall. -->
<defs>
<radialGradient id="v" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(960 540) scale(1382.4 842.4)"><stop offset=".55" stop-color="#d8ebf6" stop-opacity="0"/><stop offset="1" stop-color="#d8ebf6" stop-opacity=".5"/></radialGradient>
<radialGradient id="m" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(960 540) scale(1344 820.8)"><stop offset=".52" stop-color="#000"/><stop offset=".94" stop-color="#fff"/></radialGradient>
<mask id="k" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="url(#m)"/></mask>
<filter id="t" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="5" seed="9"/><feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.97  0 0 0 0 1  0 0 0 3.4 -0.75"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#v)"/>
<g mask="url(#k)"><rect width="1920" height="1080" filter="url(#t)"/></g>
</svg>
