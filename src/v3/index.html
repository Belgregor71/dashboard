<!doctype html>
<html lang="en-AU" data-depth="0" data-phase="idle">
<head>
  <meta charset="utf-8" />
  <title>V3</title>

  <!-- Fixed 1920x1080 wall at DPR 1. No responsive scaling: this is not a page
       that might be viewed on a phone, it is a specific rectangle on a wall. -->
  <meta name="viewport" content="width=1920, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fraunces = the said voice (opsz, wght, SOFT).
       Roboto Flex = the measured voice (opsz, wght, GRAD).
       Roboto Flex specifically because it CARRIES GRAD and Inter does not —
       the Google Fonts API 400s the axis on Inter, so a night-grade token bound
       to Inter would have been a silent no-op. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,200..700,0..100&family=Roboto+Flex:opsz,wght,GRAD@8..144,200..700,-200..150&display=swap" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/type.css" />
  <link rel="stylesheet" href="./css/compose.css" />
  <link rel="stylesheet" href="./css/light.css" />
  <link rel="stylesheet" href="./css/archive.css" />
  <link rel="stylesheet" href="./css/media.css" />
</head>
<body>
  <!-- The substrate. One continuously-caused atmospheric field: sun altitude and
       azimuth, wind vector, rain, cloud, pressure trend. Never a free-running
       shimmer — the calm law survives V3 in exactly one clause, "never move for
       a reason the room cannot see." -->
  <canvas class="substrate" id="substrate" width="480" height="270"></canvas>

  <!-- The photographic ground. An <img>, not a background-image, because the
       scrim sampler needs to read its pixels to compute legibility per photo. -->
  <div class="photo"><img id="ground" alt="" /></div>

  <!-- Shaped gradient scrim. Opacity is COMPUTED from the measured luminance
       under the text, not guessed. Blur is not a material in V3. -->
  <div class="scrim" id="scrim"></div>

  <!-- The Ambient Archive. Depth 0's other face: the memory as a lit card on a
       tilted plane, two desaturated ghosts of itself, the year engraved behind
       the plate, and one strip carrying the years this date reaches.

       ⚠ IT LIVES HERE, A CHILD OF <body>, FOR TWO REASONS. Inside .photo its
       z-index would be trapped in that element's stacking context — the exact
       fault that painted #ground-caption under the scrim at 1.02:1. Inside
       .stage it would be torn down on every depth change, and it has to survive
       them: it is what depth 0 recedes BACK to.

       Empty and invisible unless v3Archive is on. core/archive.js builds every
       node it will ever have, once. -->
  <div class="archive" id="archive" aria-hidden="true"></div>

  <!-- The field cools ~2% while the house is thinking. Above the substrate,
       below the content, so the text is never tinted. -->
  <div class="presence-cool"></div>

  <!-- Who, where, when. Empty (and invisible) unless groundMemories is on and
       the library actually knows something about the photograph.

       ⚠⚠ IT LIVES HERE, NOT INSIDE .photo, AND THAT IS THE WHOLE FIX. As a child
       of .photo (position:fixed, z-index:1 — a stacking context) its own
       z-index:2 was confined to that context, so it painted BENEATH the scrim:
       the one piece of text in V3 underneath the very layer whose job is to make
       text legible. Measured over the white ground in daylight, the scrim owned
       84% of the glyph and the caption read 1.02:1. Out here it reads 5.29:1.
       Nothing about how it looks changed — it was already position:fixed and no
       ancestor is transformed, so this move is geometrically a no-op.

       ⚠ PROVEN BY PUTTING IT BACK: with this node inside .photo the contrast
       gate fails on 13 surfaces — not as a low ratio but as "reports a rect and
       paints nothing", i.e. buried outright — and both specs in
       tests/v3-caption-legibility.spec.js go red. -->
  <p id="ground-caption" class="ground-caption" data-blank="1"></p>

  <main class="stage">
    <!-- DEPTH 0 — FIELD. Nobody present. The photograph carries it and the hour
         is the only text. Resting cost must be <=8% of one core. -->
    <section class="depth depth--field">
      <!-- The field's other ambient fact: what the room can hear. Bottom right,
           which is the rail's corner — and the two are mutually exclusive by
           construction, because the rail only appears at depths 1-2 and this
           lives inside the depth-0 layer. core/now-playing.js writes it, and
           only when the answer changes. -->
      <div class="now-playing" id="now-playing" data-cell="nowPlaying">
        <div class="now-playing__lines">
          <p class="now-playing__sub measured" id="now-playing-sub"></p>
          <p class="now-playing__title measured" id="now-playing-title"></p>
        </div>
        <img class="now-playing__art lift" id="now-playing-art" alt="" data-blank="1" />
      </div>

      <!-- The same corner, one room per row. core/media-rooms.js builds the
           rows and owns this node entirely; it is empty in the shipped HTML
           because a room that is not playing has no markup, not blank markup.

           ⚠ MUTUALLY EXCLUSIVE WITH `.now-playing` ABOVE, by construction
           rather than by CSS: initMediaRooms() returns false unless
           `v3MediaRooms` is on, and initNowPlaying() returns false when it is.
           Both are in the depth-0 layer and both take the bottom-right corner,
           so only one may ever mount. tests/v3-media-rooms.spec.js asserts it,
           because "by construction" stops being true the day someone widens
           either gate. -->
      <div class="media-rooms" id="media-rooms" data-shown="0"></div>
    </section>

    <!-- DEPTH 1 — GLANCE. Exactly one thing, at editorial scale. If it needs a
         second glance it is two states, not one screen. -->
    <section class="depth depth--glance">
      <div class="lattice">
        <!-- data-cell is the deixis address: when the voice names something,
             core/voice.js lights the matching cell. Unknown refs are dropped,
             so a name that does not exist here is simply inert. -->
        <div class="cell cell--dominant" id="glance-cell" data-cell="weather">
          <p class="said said--1" id="glance-said"></p>
          <p class="measured measured--2" id="glance-measured"></p>
        </div>
      </div>
    </section>

    <!-- DEPTH 2 — SPREAD. One dominant cell plus 2-4 supporting, chosen by the
         composer from the fixed template set. Populated by core/composer.js. -->
    <section class="depth depth--spread">
      <div class="lattice" id="spread-lattice"></div>
    </section>

    <!-- DEPTH 3 — SUBJECT. Voice named one thing; that thing fills the screen.
         Each subject module owns this node and must tear itself down on leave. -->
    <section class="depth depth--subject">
      <div class="lattice"><div class="cell cell--full" id="subject-mount"></div></div>
    </section>

    <!-- THE HOUR — and it is a child of .stage, NOT of .depth--field.

         ⚠ IT LIVED INSIDE THE FIELD LAYER UNTIL 2026-09-01, AND THAT IS WHY THE
         CLOCK VANISHED THE MOMENT THE MORNING COMMUTE EARNED THE GLANCE. Depth
         layers exchange by OPACITY, so every child of .depth--field goes to
         zero the instant :root[data-depth] leaves "0" — including the one piece
         of text on this wall the household actually needs while it is being
         told the drive to work is twenty-two minutes. Owner's verdict on the
         glass: "the clock disappears even though this is important to see so
         you can work out if you are running late."

         Out here it survives the exchange and compose.css gates it on depth
         instead: 0 and 1 only. Geometrically a no-op at depth 0 — it was
         position:absolute inside a layer that is itself inset:0, so the box it
         paints has not moved by a pixel; only its ancestry has. Placed AFTER
         the depth sections so it paints above them rather than under a spread.

         It steps down to --t-measured-1 at depth 1 (a scale, so nothing
         reflows) because depth 1 is still EXACTLY ONE THING at editorial scale:
         the glance keeps the dominant voice and the hour goes back to being
         what it is at every other depth — a supporting readout. -->
    <div class="hour" id="hour" data-cell="hour">--:--</div>

    <!-- THE FAULT PILL — the house saying a part of itself is broken.

         ⚠ THIS REPLACES AN announce() INTO THE ATTENTION QUEUE (core/health.js).
         A fault used to ride in as a score-72 candidate, win depth 1 and set
         "Home Assistant isn't answering." in 132px Fraunces across the top half
         of the wall — the house's loudest editorial voice spent on its own
         plumbing, over the top of whatever the room had actually come to see.
         Owner's verdict 2026-09-01: "the big text error messages take away from
         the dashboard itself."

         A fault is not a headline, it is a STATE, so it takes the register
         every other state on this wall takes: measured, uppercase, tracked,
         --t-rail. Same idiom as .cell__label and .now-playing__sub, which is
         how the room already reads "this is a label, not a fact competing for
         your attention".

         ⚠ IT IS THE ONE ELEMENT IN V3 WITH ITS OWN GROUND, and that is forced
         rather than decorative. --scrim is `to top` and transparent by 88%, so
         at top:var(--safe) there is NOTHING between this text and the
         photograph — the same exposure that put .heard on the KNOWN_OPEN list.
         A pill carries its own legibility instead of borrowing the scrim's.

         Top-left is genuinely free at depths 0, 1 and 2: every .cell in the
         lattice is `justify-content: flex-end`, so the top band is empty at all
         three. At depth 3 a subject's title owns this corner and the pill
         stands down — which is also the depth where the full readout lives, so
         nothing is lost by it. core/health.js is the only writer. -->
    <p class="fault" id="fault" hidden>
      <span class="fault__dot" aria-hidden="true"></span>
      <span class="fault__label" id="fault-label"></span>
    </p>

    <!-- What the house believes it heard, and the vocabulary it is teaching. -->
    <p class="heard" id="heard" hidden></p>
    <div class="rail-slot"><p class="rail" id="rail" hidden></p></div>
  </main>

  <!-- The house's presence. Not an object — the light of the screen itself. -->
  <div class="presence"></div>

  <!-- The same two globals the incumbent boots with, and for the same reason:
       core/config.js reads window.__ENV__ / __DASH_CONFIG__ at module load, and
       attentionEngine gates four phases on window.CONFIG.features. Without
       these V3 does not fall back to sensible defaults — it silently reads
       every one of those flags as false, and the two surfaces would be running
       measurably different houses while claiming to share an engine.

       Order holds regardless of where the build puts these: a module script is
       deferred, so it runs after the parser has finished, and these two plain
       scripts execute during parsing. Vite hoists the module tag into <head>
       and the globals are still set first. -->
  <script src="/env.js"></script>
  <script src="/js/config.js"></script>

  <script type="module" src="./main.js"></script>
</body>
</html>
